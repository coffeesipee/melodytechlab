<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#09090B"/>
  
  <!-- Subtle Grid Lines -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
    <radialGradient id="grad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#grad)" />

  <!-- Brand Mark -->
  <g transform="translate(100, 120)">
    <rect width="72" height="72" rx="18" fill="#18181B" stroke="#27272A" stroke-width="2"/>
    <path d="M18 52V20L36 38L54 20V52" stroke="#3B82F6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="36" cy="52" r="3.5" fill="#60A5FA"/>
    <text x="96" y="48" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5">Melodytechlab</text>
  </g>

  <!-- Typography -->
  <text x="100" y="290" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">
    High-Reliability Software
  </text>
  <text x="100" y="360" fill="#3B82F6" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">
    Engineering &amp; Architecture
  </text>
  
  <text x="100" y="440" fill="#A1A1AA" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" max-width="800">
    Boutique software engineering lab crafting scalable web apps, mobile solutions,
  </text>
  <text x="100" y="472" fill="#A1A1AA" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
    and cloud systems with zero agency bureaucracy.
  </text>

  <!-- Badges -->
  <g transform="translate(100, 520)">
    <rect width="140" height="38" rx="8" fill="#18181B" stroke="#27272A"/>
    <text x="20" y="24" fill="#E4E4E7" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Next.js &amp; Go</text>

    <rect x="156" width="160" height="38" rx="8" fill="#18181B" stroke="#27272A"/>
    <text x="176" y="24" fill="#E4E4E7" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Cloud Architecture</text>

    <rect x="332" width="160" height="38" rx="8" fill="#18181B" stroke="#27272A"/>
    <text x="352" y="24" fill="#E4E4E7" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Enterprise Delivery</text>
  </g>
</svg>
